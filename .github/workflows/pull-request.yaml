name: Build and Test
run-name: Running Build and Testing the changes
on: [push]
jobs:
  Build-Application:
    runs-on: ubuntu-latest
    steps:
      - name: Building the application
        uses: actions/checkout@v3

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build